name: Build APK
on:
  push:
  workflow_dispatch:
defaults:
  run:
    working-directory: Miniature-Android-upload
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: Miniature-Android-upload
      - name: Join the split HTML pieces
        run: |
          cat app/src/main/assets/parts/index.html.part* > app/src/main/assets/index.html
          rm -r app/src/main/assets/parts
      - name: Make folder button use the Android picker
        run: |
          python3 - <<'EOF'
          p='app/src/main/assets/index.html'
          h=open(p,encoding='utf-8').read()
          old='async function addFolder(){'
          assert h.count(old)==1
          h=h.replace(old,old+'if(window.AndroidBridge){toast("Opening folder picker…");pickFolderInput();return}')
          open(p,'w',encoding='utf-8').write(h)
          EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Miniature-apk
          path: Miniature-Android-upload/app/build/outputs/apk/debug/app-debug.apk
